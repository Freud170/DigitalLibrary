[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digitallibrary"
version = "0.1.0"
description = "Gemeinsamer Backlog für Spiele und Bücher – was spiele oder lese ich als Nächstes?"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.160",
    "uvicorn>=0.50",
    "jinja2>=3.1",
    "python-multipart>=0.0.30",
    "SQLAlchemy>=2.1",
    "alembic>=1.20",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.17",
]

[project.scripts]
digitallibrary = "digitallibrary.__main__:main"

[tool.setuptools.packages.find]
include = ["digitallibrary*"]

[tool.setuptools.package-data]
digitallibrary = ["templates/*.html", "static/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "S", "BLE", "PLE", "PLW", "PERF", "T20", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Umlaute/typografische Zeichen in deutschen Texten sind gewollt
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]  # assert und Zufall mit festem Startwert in Tests
"digitallibrary/migrations/versions/*" = ["E501"]  # von Alembic erzeugt
